name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          netlify deploy --prod --dir=. --functions=netlify/functions \
            --message "Production: ${{ github.sha }}"

      - name: Deploy preview
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          netlify deploy --dir=. --functions=netlify/functions \
            --alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }}: ${{ github.sha }}" \
            --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Netlify preview: ${{ steps.preview.outputs.url }}`
            });
